[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-support-ai"
version = "0.1.0"
description = "AI customer support and ticket automation system"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "fastembed>=0.8.1",
    "qdrant-client>=1.19.1",
    "openai>=3.19.2",
    "langgraph>=1.2.12",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx2",
    "ruff",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

